name: chess_puzzle_app
description: ROK online chess application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0-229.0.dev <4.0.0'

dependencies:
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.4
  flutter_localizations:
    sdk: flutter
  chess: ^0.8.1
  stockfish:
    path: third_party/stockfish
  flutter:
    sdk: flutter
  http: ^0.13.5
  url_launcher: ^6.3.3

  provider: 
  supabase_flutter: ^2.14.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - COPYING.md
    - STOCKFISH_NOTICES.md
    - third_party/stockfish/LICENSE
    - lib/images/
    - lib/images/wood/

flutter_launcher_icons:
  android: "ic_launcher_rok"
  ios: true
  image_path: "assets/branding/rok-app-icon.png"
  adaptive_icon_background: "#171412"
  adaptive_icon_foreground: "assets/branding/rok-app-icon-foreground.png"
  adaptive_icon_foreground_inset: 28
  min_sdk_android: 21
  remove_alpha_ios: true
